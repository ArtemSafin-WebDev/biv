<button class="career-story-card career-story-card--{{portrait}}" type="button" tabindex="-1" aria-disabled="true" aria-label="История {{number}}">
    <span class="career-story-card__background" aria-hidden="true"></span>
    <span class="career-story-card__portrait">
        <img class="career-story-card__image career-story-card__image--tinted" src="{{image}}" alt="" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async" draggable="false" aria-hidden="true">
        <img class="career-story-card__image career-story-card__image--color" src="{{image}}" alt="{{imageAlt}}" width="{{imageWidth}}" height="{{imageHeight}}" loading="lazy" decoding="async" draggable="false">
    </span>
    <svg class="career-story-card__play" width="115" height="115" aria-hidden="true"><use xlink:href="#career-stories/play"></use></svg>
</button>
