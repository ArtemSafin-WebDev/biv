<dialog class="employer-rating-modal js-modal" id="employer-rating-modal"
    aria-labelledby="employer-rating-modal-title" aria-describedby="employer-rating-modal-description" data-lenis-prevent>
    <div class="employer-rating-modal__body">
        <picture class="employer-rating-modal__art" aria-hidden="true">
            <source media="(max-width: 576px)" srcset="/images/employer-rating-modal/art-mobile.svg">
            <source media="(max-width: 1366px)" srcset="/images/employer-rating-modal/art-compact.svg">
            <img class="employer-rating-modal__image" src="/images/employer-rating-modal/art-desktop.svg"
                width="300" height="360" alt="">
        </picture>

        <div class="employer-rating-modal__content">
            <h2 class="employer-rating-modal__title" id="employer-rating-modal-title">
                Наша компания участвует в&nbsp;Рейтинге работодателей.
            </h2>
            <p class="employer-rating-modal__description" id="employer-rating-modal-description">
                BIV в&nbsp;рейтинге работодателей HH в&nbsp;разделе «Технологии и&nbsp;цифровые решения →ИТ-компании»
            </p>
            <a class="btn employer-rating-modal__vote" href="#">Проголосовать</a>
        </div>

        <button class="employer-rating-modal__close" type="button" data-modal-close aria-label="Закрыть попап" autofocus>
            <svg class="employer-rating-modal__close-icon" width="40.6" height="40.6" aria-hidden="true">
                <use xlink:href="#employer-rating/close"></use>
            </svg>
        </button>
    </div>
</dialog>
