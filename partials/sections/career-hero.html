<div class="career-hero-spacer">
    <section class="career-hero" aria-labelledby="career-hero-title">
        <div class="career-hero__bg" aria-hidden="true">
            <img src="/images/career-hero/bg.webp" alt="">
        </div>

        <div class="career-hero__stage">
            <div class="career-hero__disc">
                <img class="career-hero__shape" src="/images/career-hero/shape.svg" alt="" aria-hidden="true">

                <nav class="career-hero__nav" aria-label="Разделы страницы карьеры">
                    <ul class="career-hero__links">
                        {{#each careerHeroLinks}}
                        <li class="career-hero__link-item career-hero__link-item--{{ position }}">
                            <a class="career-hero__link" href="{{ href }}">{{ title }}</a>
                        </li>
                        {{/each}}
                    </ul>
                </nav>

                <div class="career-hero__logo">
                    <img src="/images/career-hero/logo.webp" alt="BIV">
                </div>
            </div>

            <h1 class="career-hero__title" id="career-hero-title">карьера</h1>
        </div>
    </section>
</div>
