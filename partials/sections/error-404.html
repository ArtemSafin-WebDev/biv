<section class="error-404" aria-labelledby="error-404-title">
  <div class="error-404__content">
    <h1 class="error-404__title" id="error-404-title">{{ error404.title }}</h1>
    <p class="error-404__text">
      {{ error404.text }}
      <a class="error-404__home-link" href="{{ error404.homeLinkHref }}">{{ error404.homeLinkText }}</a>
    </p>
  </div>

  <div class="error-404__decor" aria-hidden="true">
    {{#times 9}}
      <span class="error-404__circle"></span>
    {{/times}}
  </div>
</section>
